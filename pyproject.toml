[project]
name = "revgate"
version = "0.2.0"
description = "Human-in-the-loop, GitHub-style review for GitHub Copilot. Manual-first: /revgate-review and /revgate-plan run on demand, with one automatic exception — plan mode is gated via preToolUse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1,<9",
    "flask>=3.1,<4",
    "waitress>=3.0.2,<4",
]

[project.scripts]
revgate = "revgate.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-waitress>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `public/` sits inside the package directory, so it ships as package data on
# its own. A force-include for it only duplicates the path and fails the build.
packages = ["src/revgate"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG",
    "TID", "RUF", "S", "T20", "ANN", "PL",
    # Added beyond the plan's list: the plan requires a justified `# noqa: BLE001`
    # on each wrapper that swallows an error, and that suppression is only
    # meaningful — and only enforced on new code — while the rule is selected.
    "BLE",
    # Same reasoning for the waitress private attributes: the plan confines them
    # to server/wsgi.py, and only this rule keeps a second module from reaching
    # for one.
    "SLF",
]
ignore = [
    # `Any` is unavoidable at the JSON boundary.
    "ANN401",
    # The diff parser and the argument loop are long by contract.
    "PLR0912",
    "PLR0915",
    # subprocess use is the point, and the argv is never given to a shell.
    "S404",
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic values, spawn subprocesses, and need no annotations on
# their fixtures beyond the return type.
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
# waitress ships no py.typed marker for its vendored asyncore copy.
module = ["waitress.wasyncore"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
parallel = true
source = ["revgate"]

[tool.coverage.paths]
source = ["src/revgate", "*/site-packages/revgate"]
